<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="テレビ、花瓶、ドラム缶、上司のマグカップを8種類の武器で粉砕しまくるストレス解消ゲーム。">
<meta name="theme-color" content="#14110e">
<title>ぶっ壊しルーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed concrete rage room on canvas; stats float top-left, rage gauge top-right, weapon rack docked at the floor */
:root{
  --bg:#14110e;
  --panel:#211c17;
  --line:#3d342b;
  --ink:#f3ebdf;
  --dim:#a39684;
  --hazard:#ffc21a;
  --heat:#ff5a1f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.stats{display:flex;gap:20px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000}
.stat span{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dim)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto;width:min(220px,46vw)}
.gauge-label{display:flex;justify-content:space-between;width:100%;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--dim)}
.gauge-label em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.gauge{width:100%;height:12px;background:#0b0907;border:2px solid var(--line);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--hazard) 0 8px,var(--heat) 8px 16px);transition:width .15s}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:700 12px var(--ui);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--dim)}
.btn:focus-visible,.wbtn:focus-visible,#stressText:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
#mega{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.04em}
#mega:disabled{opacity:.4;cursor:default}
#mega.ready{background:var(--heat);border-color:var(--hazard);color:#1a0d05;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07);box-shadow:0 0 18px var(--heat)}}
.stress{display:flex;gap:6px;width:100%}
.stress[hidden]{display:none!important}
#stressText{flex:1;min-width:0;font:700 14px var(--ui);color:var(--ink);background:#0b0907;border:2px solid var(--line);border-radius:5px;padding:6px 8px}
.rack{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;background:linear-gradient(to top,rgba(11,9,7,.97) 60%,rgba(11,9,7,.75));border-top:2px solid #000;scrollbar-width:none}
.rack::-webkit-scrollbar{display:none}
.rack>:first-child{margin-left:auto}.rack>:last-child{margin-right:auto}
.wbtn{flex:0 0 auto;min-width:84px;padding:7px 10px 8px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;font:900 13px var(--ui);text-align:left;cursor:pointer}
.wbtn .k{display:block;font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.1em}
.wbtn .short{display:none}
.wbtn .sw{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--c)}
.wbtn[aria-pressed="true"]{border-color:var(--hazard);background:#3a2c0e}
.wbtn[aria-pressed="true"] .k{color:var(--hazard)}
.sheet{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(8,6,4,.72)}
.sheet[hidden]{display:none!important}
.sheet-box{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{margin:0;font:400 22px var(--display);letter-spacing:.04em}
.set-group{display:flex;flex-direction:column;gap:8px}
.set-label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dim)}
.seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px;background:#0b0907;border:2px solid var(--line);border-radius:6px;padding:3px}
.seg button{font:900 13px var(--ui);color:var(--dim);background:transparent;border:0;border-radius:4px;padding:8px 4px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--hazard);color:#1a1205}
.seg button:focus-visible,.tog:focus-visible,#vol:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.set-note{margin:0;font-size:12px;line-height:1.6;color:var(--dim);min-height:2.4em}
.set-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.set-row small{display:block;font-weight:500;font-size:11px;color:var(--dim)}
.tog{min-width:64px;font:900 12px var(--ui);color:var(--dim);background:#0b0907;border:2px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.tog[aria-pressed="true"]{color:#1a1205;background:var(--hazard);border-color:var(--hazard)}
#vol{width:min(180px,45vw);accent-color:var(--hazard)}
@media (max-width:520px){.stat.mx{display:none}.stat b{font-size:20px}.stats{gap:12px}.btn{padding:5px 8px;font-size:11px}.side{gap:6px}}
.fab{position:fixed;right:16px;z-index:5;font:400 17px var(--display);color:#1a0d05;background:var(--heat);border:3px solid var(--hazard);border-radius:999px;padding:14px 20px;box-shadow:0 6px 0 #7a2400,0 0 26px rgba(255,90,31,.7);cursor:pointer;animation:pulse .5s ease-in-out infinite alternate;touch-action:manipulation}
.fab[hidden]{display:none!important}
@media (min-width:761px) and (pointer:fine){.fab{display:none!important}}
.fab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:760px),(pointer:coarse){
  .rack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;overflow:visible;padding-top:8px;touch-action:manipulation}
  .rack>:first-child,.rack>:last-child{margin:0}
  .wbtn{min-width:0;min-height:46px;padding:6px 0;font-size:11px;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-align:center;touch-action:manipulation}
  .wbtn .k,.wbtn .full{display:none}
  .wbtn .short{display:inline}
  .wbtn .sw{margin:5px auto 0;width:70%}
  #mega{display:none}
}
</style>
</head>
<body>

<canvas id="c" aria-label="破壊エリア"></canvas>

<div class="hud">
  <div class="stats">
    <div class="stat"><b id="sScore">0</b><span>スコア</span></div>
    <div class="stat"><b id="sKills">0</b><span>破壊数</span></div>
    <div class="stat mx"><b id="sMax">0</b><span>最大コンボ</span></div>
  </div>
  <div class="side">
    <div class="gauge-label"><span>ブチギレゲージ</span><em id="gPct">0%</em></div>
    <div class="gauge"><i id="gBar"></i></div>
    <div class="row">
      <button class="btn" id="stressBtn" type="button">ストレス投入</button>
      <button class="btn" id="setBtn" type="button" aria-haspopup="dialog">設定</button>
      <button class="btn" id="mega" type="button" disabled>解放 [Space]</button>
    </div>
    <form class="stress" id="stressForm" hidden>
      <input id="stressText" maxlength="10" placeholder="ムカつくもの" autocomplete="off">
      <button class="btn" type="submit">落とす</button>
    </form>
  </div>
</div>

<nav class="rack" id="rack" aria-label="武器"></nav>
<button class="fab" id="megaFab" type="button" hidden>ブチギレ解放!</button>

<div class="sheet" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet-box">
    <div class="sheet-head"><h2 id="setTitle">設定</h2><button class="btn" id="setClose" type="button">閉じる [Esc]</button></div>
    <div class="set-group">
      <span class="set-label">表示クオリティ</span>
      <div class="seg" id="qSeg" role="radiogroup" aria-label="表示クオリティ">
        <button type="button" role="radio" data-q="low">弱め</button>
        <button type="button" role="radio" data-q="mid">普通</button>
        <button type="button" role="radio" data-q="high">強め</button>
        <button type="button" role="radio" data-q="max">最高</button>
      </div>
      <p class="set-note" id="qNote"></p>
    </div>
    <div class="set-group">
      <span class="set-label">落ちてくる数</span>
      <div class="seg" id="dSeg" role="radiogroup" aria-label="落ちてくる数" style="--n:5">
        <button type="button" role="radio" data-d="few">少なめ</button>
        <button type="button" role="radio" data-d="mid">普通</button>
        <button type="button" role="radio" data-d="many">多め</button>
        <button type="button" role="radio" data-d="lots">大量</button>
        <button type="button" role="radio" data-d="max">限界</button>
      </div>
      <p class="set-note" id="dNote"></p>
    </div>
    <div class="set-list">
      <div class="set-row"><span>音</span><button class="tog" type="button" data-key="sound"></button></div>
      <div class="set-row"><label for="vol">音量</label><input type="range" id="vol" min="0" max="100" step="5"></div>
      <div class="set-row"><span>画面の揺れ</span><button class="tog" type="button" data-key="shake"></button></div>
      <div class="set-row"><span>フラッシュ<small>爆発や落雷で画面が光る演出</small></span><button class="tog" type="button" data-key="flash"></button></div>
      <div class="set-row"><span>ヒットストップ<small>大きい物を壊した瞬間に一瞬止まる演出</small></span><button class="tog" type="button" data-key="hitstop"></button></div>
      <div class="set-row"><span>擬音の文字<small>「パリーン」「ドゴォン」などの文字</small></span><button class="tog" type="button" data-key="words"></button></div>
      <div class="set-row"><span>振動<small>スマホで壊したときにブルッと震える(対応端末のみ)</small></span><button class="tog" type="button" data-key="vib"></button></div>
      <div class="set-row"><span>指の少し上を狙う<small>タッチ操作で、狙う位置を指で隠れない上側にずらす</small></span><button class="tog" type="button" data-key="aimUp"></button></div>
      <div class="set-row"><span>FPS表示</span><button class="tog" type="button" data-key="fps"></button></div>
    </div>
  </div>
</div>

<script>
(() => {
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const UIF = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif';
const DF = '"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif';
const G = 1900, PAD = 10;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const QUALITY = {
  low:  { dpr: 1, pm: .45, sm: .6,  maxP: 900,  maxS: 220,  glow: 0,   ga: 0,   objs: .8,  note: '破片と粒子を減らして軽くします。古いスマホや重いと感じるとき向け。' },
  mid:  { dpr: 2, pm: 1,   sm: 1,   maxP: 2400, maxS: 520,  glow: 0,   ga: 0,   objs: 1,   note: '標準の見た目です。' },
  high: { dpr: 2, pm: 1.6, sm: 1.35, maxP: 4000, maxS: 800, glow: .25, ga: .7,  objs: 1.1, note: '粒子が1.6倍、破片が細かくなり、炎や光がにじんで光ります。' },
  max:  { dpr: 3, pm: 2.2, sm: 1.8, maxP: 6500, maxS: 1300, glow: .34, ga: 1,   objs: 1.25, note: '粒子2.2倍、破片1.8倍、高解像度、強い光のにじみ、物も増えます。高性能なPC向け。' }
};
const SKEY = 'smash-room-settings';
const DENS = {
  few:  { m: .6,  note: 'ゆったり。ひとつずつ丁寧に壊したいとき向け。' },
  mid:  { m: 1,   note: '標準の数です。' },
  many: { m: 1.7, note: '常に物がたくさん積み上がります。' },
  lots: { m: 2.6, note: '物の山。爆弾やブラックホールが気持ちいい量です。' },
  max:  { m: 4,   note: '画面が埋まるまで降ってきます。重くなるので画質「弱め」との併用がおすすめ。' }
};
const S = { q: 'mid', dens: 'mid', sound: true, vol: 70, shake: true, flash: true, hitstop: true, words: true, vib: true, aimUp: false, fps: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) {}
if (!QUALITY[S.q]) S.q = 'mid';
if (!DENS[S.dens]) S.dens = 'mid';
let Q = QUALITY[S.q];
let SHAKE_MUL = S.shake ? (reduce ? 0.25 : 1) : 0;
const saveS = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
const dec = document.createElement('canvas'), dcx = dec.getContext('2d');
const glw = document.createElement('canvas'), gwx = glw.getContext('2d');
const rackEl = document.getElementById('rack');
let W = 0, H = 0, DPR = 1, floorY = 0;

// ================= AUDIO =================
let AC = null, master = null, noiseBuf = null, muted = !S.sound, laserG = null, flameG = null, laserO = null, sawG = null, sawO = null, iceG = null;
const lastS = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : S.vol / 100 * .7;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
  master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2.5, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // laser hum loop
  laserG = AC.createGain(); laserG.gain.value = 0;
  const lf = AC.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 1400;
  laserO = AC.createOscillator(); laserO.type = 'sawtooth'; laserO.frequency.value = 92;
  const o2 = AC.createOscillator(); o2.type = 'square'; o2.frequency.value = 184.7;
  const o2g = AC.createGain(); o2g.gain.value = .35;
  laserO.connect(lf); o2.connect(o2g).connect(lf); lf.connect(laserG).connect(master); laserO.start(); o2.start();
  // flame roar loop
  flameG = AC.createGain(); flameG.gain.value = 0;
  const fs = AC.createBufferSource(); fs.buffer = noiseBuf; fs.loop = true;
  const ff = AC.createBiquadFilter(); ff.type = 'bandpass'; ff.frequency.value = 700; ff.Q.value = .6;
  fs.connect(ff).connect(flameG).connect(master); fs.start();
  // chainsaw motor loop
  sawG = AC.createGain(); sawG.gain.value = 0;
  sawO = AC.createOscillator(); sawO.type = 'sawtooth'; sawO.frequency.value = 75;
  const lfo = AC.createOscillator(); lfo.frequency.value = 26; const lfoG = AC.createGain(); lfoG.gain.value = 16;
  lfo.connect(lfoG).connect(sawO.frequency); lfo.start();
  const sf = AC.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 1700;
  sawO.connect(sf).connect(sawG).connect(master); sawO.start();
  // freeze hiss loop
  iceG = AC.createGain(); iceG.gain.value = 0;
  const is = AC.createBufferSource(); is.buffer = noiseBuf; is.loop = true;
  const iff = AC.createBiquadFilter(); iff.type = 'highpass'; iff.frequency.value = 3800;
  is.connect(iff).connect(iceG).connect(master); is.start();
}
function thr(key, gap) { const t = performance.now(); if (lastS[key] && t - lastS[key] < gap * 1000) return false; lastS[key] = t; return true; }
function nz(dur, type, f0, f1, vol, q = .8, delay = 0, a = .003) {
  if (!AC) return; const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 1.2); s.stop(t + dur + .05);
}
function tn(dur, type, f0, f1, vol, delay = 0, a = .003) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  wood() { nz(.16, 'lowpass', 1800, 300, .6); tn(.12, 'triangle', 190, 70, .4); },
  glass() { tn(.25, 'sine', rand(2600, 4200), 0, .12); nz(.06, 'highpass', 4000, 0, .25); },
  ceramic() { tn(.2, 'triangle', rand(1500, 2400), 0, .14); nz(.07, 'bandpass', 2500, 0, .3, 2); },
  metal() { const f = rand(280, 480); tn(.45, 'square', f, f * .98, .06); tn(.5, 'triangle', f * 2.76, 0, .08); nz(.05, 'bandpass', 3000, 0, .3, 2); },
  fruit() { nz(.14, 'lowpass', 900, 200, .6); tn(.1, 'sine', 180, 80, .4); },
  stone() { nz(.16, 'lowpass', 1200, 200, .7); tn(.15, 'sine', 120, 50, .5); },
  woodBrk() { nz(.4, 'bandpass', 900, 180, .9, 1.2); tn(.22, 'square', 110, 40, .2); for (let i = 0; i < 3; i++) nz(.05, 'highpass', 2500, 0, .3, .8, rand(0, .12)); },
  glassBrk() { nz(.55, 'highpass', 2500, 7000, .55); for (let i = 0; i < 7; i++) tn(rand(.1, .4), 'sine', rand(2200, 6500), 0, .07, rand(0, .3)); },
  ceramicBrk() { nz(.32, 'bandpass', 2300, 1100, .8, 1.6); for (let i = 0; i < 4; i++) tn(rand(.08, .25), 'triangle', rand(1200, 3200), 0, .08, rand(0, .15)); },
  metalBrk() { nz(.5, 'lowpass', 2500, 150, .9); const f = rand(200, 320); tn(.9, 'square', f, f * .9, .07); tn(.9, 'triangle', f * 2.4, 0, .07); },
  snow() { nz(.12, 'lowpass', 900, 300, .5); },
  snowBrk() { nz(.4, 'lowpass', 1400, 150, .9); nz(.3, 'bandpass', 2500, 800, .25, 1, .05); },
  paper() { nz(.08, 'highpass', 2500, 0, .3); },
  paperBrk() { nz(.35, 'bandpass', 1800, 5000, .6, 1.5); nz(.25, 'highpass', 3000, 0, .3, 1, .12); },
  coin() { const f = rand(1900, 2400); tn(.18, 'sine', f, 0, .05); tn(.25, 'sine', f * 1.34, 0, .04, .04); },
  splash() { nz(.45, 'lowpass', 1800, 200, .7); for (let i = 0; i < 5; i++) tn(.08, 'sine', rand(300, 900), rand(900, 1600), .06, rand(0, .25)); },
  pop() { nz(.08, 'highpass', 2000, 0, .7); tn(.12, 'sine', 1400, 300, .2); },
  hiss() { nz(1.4, 'highpass', 1500, 5000, .5, .7, 0, .02); nz(.3, 'lowpass', 900, 100, .6); },
  fruitBrk() { nz(.35, 'lowpass', 1100, 120, 1); tn(.2, 'sine', 240, 50, .6); nz(.25, 'bandpass', 600, 300, .4, 2, .05); },
  elecBrk() { nz(.45, 'bandpass', 1600, 300, .6, 2); tn(.35, 'sawtooth', 130, 50, .15); for (let i = 0; i < 5; i++) nz(.03, 'highpass', 4000, 0, .35, .7, rand(0, .3)); nz(.6, 'lowpass', 900, 80, .7, .7, .05); },
  stoneBrk() { nz(.55, 'lowpass', 1500, 90, 1); tn(.4, 'sine', 95, 35, .7); for (let i = 0; i < 4; i++) nz(.06, 'bandpass', 1800, 0, .3, 1, rand(0, .2)); },

function shatter(o, ix, iy, power, glassy) {

    if (c > 0 && c < cols) x += rand(-.35, .35) * cw; if (r > 0 && r < rows) y += rand(-.35, .35) * ch;
    gx[r][c] = [x, y]; } }
  const polys = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = gx[r][c], b = gx[r][c + 1], d = gx[r + 1][c + 1], e = gx[r + 1][c];
    if (glassy || Math.random() < .45) { if (Math.random() < .5) { polys.push([a, b, d], [a, d, e]); } else { polys.push([a, b, e], [b, d, e]); } }
    else polys.push([a, b, d, e]);
  }
  const ca = Math.cos(o.a), sa = Math.sin(o.a);
  for (const p of polys) {
    let cx = 0, cy = 0; for (const q of p) { cx += q[0]; cy += q[1]; } cx /= p.length; cy /= p.length;
    const pts = p.map(q => [q[0] - cx, q[1] - cy]); let rad = 0; for (const q of pts) rad = Math.max(rad, Math.hypot(q[0], q[1]));
    const wx = o.x + cx * ca - cy * sa, wy = o.y + cx * sa + cy * ca;
    let dx = wx - ix, dy = wy - iy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const sp = power * rand(.45, 1.15);
    shards.push({ spr: o.spr, w: o.w, h: o.h, cx, cy, pts, rad, x: wx, y: wy, a: o.a, vx: o.vx * .5 + dx * sp, vy: o.vy * .5 + dy * sp - rand(150, 380), va: rand(-14, 14), life: rand(2.6, 4), glassy });
  }
  if (shards.length > Q.maxS) shards.splice(0, shards.length - Q.maxS);
}

// ================= RENDER =================
function drawBG() {
  const g = bgx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  let gr = g.createLinearGradient(0, 0, 0, floorY); gr.addColorStop(0, '#191512'); gr.addColorStop(1, '#2c251f'); g.fillStyle = gr; g.fillRect(0, 0, W, floorY);
  const pw = clamp(W / 5, 150, 260), ph = floorY * .5;

  for (let x = pw; x < W; x += pw) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, floorY); g.stroke(); }
  g.beginPath(); g.moveTo(0, ph); g.lineTo(W, ph); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.035)'; for (let x = pw; x < W; x += pw) { g.beginPath(); g.moveTo(x + 2, 0); g.lineTo(x + 2, floorY); g.stroke(); }
  g.fillStyle = 'rgba(0,0,0,.35)';
  for (let x = pw / 4; x < W; x += pw / 2) for (let y = ph / 4; y < floorY - 20; y += ph / 2) { g.beginPath(); g.arc(x, y, 3, 0, TAU); g.fill(); }
  const R = mulberry(7);
  for (let i = 0; i < W * floorY / 260; i++) { g.fillStyle = R() < .5 ? 'rgba(0,0,0,.09)' : 'rgba(255,255,255,.03)'; g.fillRect(R() * W, R() * floorY, 1.5, 1.5); }
  // stencil

  const fs = clamp(W / 9, 44, 130); g.font = `400 ${fs}px ${DF}`; g.fillText('粉砕室 03', 24, ph - 24);
  g.font = `900 ${fs * .2}px ${UIF}`; g.fillText('ここにある物は、全部壊してよし。', 28, ph + fs * .32);
  g.restore();

  const bh = 14; g.save(); g.beginPath(); g.rect(0, floorY - bh, W, bh); g.clip(); g.fillStyle = '#ffc21a'; g.fillRect(0, floorY - bh, W, bh);
  g.fillStyle = '#16120e'; for (let x = -40; x < W + 40; x += 28) { g.beginPath(); g.moveTo(x, floorY); g.lineTo(x + 14, floorY); g.lineTo(x + 28, floorY - bh); g.lineTo(x + 14, floorY - bh); g.closePath(); g.fill(); }
  g.restore();
  gr = g.createLinearGradient(0, floorY, 0, H); gr.addColorStop(0, '#26201b'); gr.addColorStop(1, '#0d0b09'); g.fillStyle = gr; g.fillRect(0, floorY, W, H - floorY);

}

function render() {

    ctx.fillStyle = '#7a8a3a'; ctx.beginPath(); ctx.moveTo(-10, -3); ctx.lineTo(-14, -7); ctx.lineTo(-6, -3); ctx.moveTo(-10, 3); ctx.lineTo(-14, 7); ctx.lineTo(-6, 3); ctx.fill(); ctx.restore(); }
  // normal particles

function drawGlow() {
  const g = gwx, k = Q.glow; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, glw.width, glw.height);
  g.setTransform(k, 0, 0, k, 0, 0); g.globalCompositeOperation = 'lighter';
  for (const p of parts) { const f = p.life / p.max;
    if (p.k === 'fire') { g.globalAlpha = f * .5; g.fillStyle = p.hue === 270 ? '#a070ff' : `hsl(${10 + f * 38},100%,55%)`; g.beginPath(); g.arc(p.x, p.y, p.s * 2.2, 0, TAU); g.fill(); }

    else if (p.k === 'ice') { g.globalAlpha = f * .4; g.fillStyle = '#7fd8ff'; g.beginPath(); g.arc(p.x, p.y, p.s * 2, 0, TAU); g.fill(); } }
  for (const b of bolts) { g.globalAlpha = b.life / b.max; g.strokeStyle = '#7fc8ff'; g.lineWidth = b.w * 8; g.beginPath(); g.moveTo(b.pts[0][0], b.pts[0][1]); for (const q of b.pts) g.lineTo(q[0], q[1]); g.stroke(); }
  if (beam) { g.globalAlpha = 1; g.strokeStyle = '#ff3d7f'; g.lineWidth = 34; g.beginPath(); g.moveTo(beam.ox, beam.oy); g.lineTo(beam.x, beam.y); g.stroke(); }
  for (const m of meteors) { g.globalAlpha = 1; g.fillStyle = '#ff8a3d'; g.beginPath(); g.arc(m.x, m.y, 90, 0, TAU); g.fill(); }
  for (const h of holes) { g.globalAlpha = .8; g.fillStyle = '#8a50ff'; g.beginPath(); g.arc(h.x, h.y, 90, 0, TAU); g.fill(); }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

}

  else if (w.id === 'missile') { const s = 22 + Math.sin(gameT * 8) * 3; for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { ctx.beginPath(); ctx.moveTo(x + a * s, y + b * (s - 8)); ctx.lineTo(x + a * s, y + b * s); ctx.lineTo(x + a * (s - 8), y + b * s); ctx.stroke(); }
    ctx.font = `900 10px ${UIF}`; ctx.textAlign = 'center'; ctx.fillText('LOCK', x, y + s + 12); }
  else if (w.id === 'ice') { ctx.globalAlpha = .5; ctx.beginPath(); ctx.arc(x, y, 60, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * 9, y - Math.sin(a) * 9); ctx.lineTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); ctx.stroke(); } }
  else if (wi === 4) { ctx.beginPath(); ctx.arc(x, y, 55, 0, TAU); ctx.globalAlpha = .35; ctx.stroke(); ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill(); }
  else if (wi === 7) { ctx.globalAlpha = .7; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x, y, 10 + i * 7, gameT * 4 + i * 2, gameT * 4 + i * 2 + 2); ctx.stroke(); } }
  else if (wi === 5) { ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(x, y, 24, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x - 4, y - 10); ctx.lineTo(x + 3, y - 1); ctx.lineTo(x - 2, y + 1); ctx.lineTo(x + 4, y + 10); ctx.stroke(); }
  else { const r = wi === 2 ? 70 : wi === 3 ? 26 : 16; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.globalAlpha = wi === 2 ? .45 : 1; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(x - r - 6, y); ctx.lineTo(x - r + 6, y); ctx.moveTo(x + r - 6, y); ctx.lineTo(x + r + 6, y); ctx.moveTo(x, y - r - 6); ctx.lineTo(x, y - r + 6); ctx.moveTo(x, y + r - 6); ctx.lineTo(x, y + r + 6); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill(); }
  ctx.restore();
}

// ================= HUD & INPUT =================
const $ = id => document.getElementById(id);
const megaFab = $('megaFab');
const sScore = $('sScore'), sKills = $('sKills'), sMax = $('sMax'), gBar = $('gBar'), gPct = $('gPct'), megaBtn = $('mega');
let lastHud = '';
function hud() {
  const key = score + '|' + kills + '|' + maxCombo + '|' + (gauge | 0);
  if (key === lastHud) return; lastHud = key;
  sScore.textContent = score.toLocaleString(); sKills.textContent = kills; sMax.textContent = maxCombo;
  gBar.style.width = gauge + '%'; gPct.textContent = (gauge | 0) + '%';
  const ready = gauge >= 100; megaFab.hidden = !ready; megaBtn.disabled = !ready; megaBtn.classList.toggle('ready', ready); megaBtn.textContent = ready ? 'ブチギレ解放!' : '解放 [Space]';
}
WEAPONS.forEach((w, i) => {
  w.cd = 0;
  const b = document.createElement('button'); b.className = 'wbtn'; b.type = 'button'; b.style.setProperty('--c', w.color);
  b.innerHTML = `<span class="k">${KEYS[i].toUpperCase()}</span><span class="full">${w.name}</span><span class="short">${w.short}</span><span class="sw"></span>`; b.setAttribute('aria-label', w.name); b.setAttribute('aria-pressed', i === 0);
  b.addEventListener('click', () => { initAudio(); setWeapon(i); }); rackEl.appendChild(b); w.btn = b;
});
function setWeapon(i) { wi = (i + WEAPONS.length) % WEAPONS.length; WEAPONS.forEach((w, j) => w.btn.setAttribute('aria-pressed', j === wi)); WEAPONS[wi].btn.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }

function mega() {
  if (gauge < 100) return; initAudio(); gauge = 0; slowT = .9; banner = { text: 'ブチギレ解放!!!', t: 0 }; flashA = .9; flashC = '#fff'; sfx('mega', .5);
  const list = objs.slice().sort((a, b) => Math.abs(a.x - W / 2) - Math.abs(b.x - W / 2));
  list.forEach((o, i) => later(.12 + i * .055, () => { if (!o.dead) explode(o.x, o.y, 150, 999); }));
  for (let i = 0; i < 6; i++) later(.1 + i * .12, () => explode(rand(60, W - 60), rand(floorY - 260, floorY - 20), 160, 120));
  later(1.5, () => { for (let i = 0; i < maxObjs() + 4; i++) spawn(pickType(), rand(50, W - 50), -rand(80, 1000)); });
}
megaBtn.addEventListener('click', mega);
megaFab.addEventListener('click', mega);

const ptrs = new Map();
const aimY = e => e.clientY - (e.pointerType === 'touch' && S.aimUp ? 64 : 0);
cv.addEventListener('pointerdown', e => {
  initAudio(); pType = e.pointerType; px = e.clientX; py = aimY(e); down = true;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  ptrs.set(e.pointerId, { x: px, y: py, cd: 0 }); e.preventDefault();
});
cv.addEventListener('pointermove', e => { pType = e.pointerType; const p = ptrs.get(e.pointerId); const y = aimY(e);
  if (p) { p.x = e.clientX; p.y = y; } if (p || e.pointerType === 'mouse') { px = e.clientX; py = y; } });
const up = e => { ptrs.delete(e.pointerId); down = ptrs.size > 0; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { if (!down && pType === 'mouse') px = -999; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { e.preventDefault(); setWeapon(wi + (e.deltaY > 0 ? 1 : -1)); }, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !setSheet.hidden) { openSettings(false); return; }
  if (e.target.tagName === 'INPUT' || !setSheet.hidden) return;
  const n = KEYS.indexOf(e.key.toLowerCase()); if (n >= 0 && n < WEAPONS.length) { setWeapon(n); return; }
  if (e.code === 'Space') { e.preventDefault(); mega(); }
});
const stressForm = $('stressForm'), stressText = $('stressText');
$('stressBtn').addEventListener('click', () => { stressForm.hidden = !stressForm.hidden; if (!stressForm.hidden) stressText.focus(); });
stressForm.addEventListener('submit', e => {
  e.preventDefault(); initAudio(); const v = stressText.value.trim(); if (!v) { stressText.focus(); return; }
  const o = spawn('sign', clamp(W / 2 + rand(-W / 4, W / 4), 100, W - 100), -80, v); o.vy = 300;
  addText('投入!', o.x, Math.max(90, H * .2), 30, '#7dff9a'); stressText.value = ''; stressText.blur(); stressForm.hidden = true;
});
const setSheet = $('settings'), qSeg = $('qSeg'), dSeg = $('dSeg'), vol = $('vol'), setBtn = $('setBtn');
function applyAudio() { muted = !S.sound; if (master) master.gain.value = muted ? 0 : S.vol / 100 * .7; }
function syncSettings() {
  for (const b of qSeg.querySelectorAll('button')) b.setAttribute('aria-checked', b.dataset.q === S.q);
  $('qNote').textContent = Q.note;
  for (const b of dSeg.querySelectorAll('button')) b.setAttribute('aria-checked', b.dataset.d === S.dens);
  $('dNote').textContent = DENS[S.dens].note;
  for (const b of setSheet.querySelectorAll('.tog')) { const on = !!S[b.dataset.key]; b.setAttribute('aria-pressed', on); b.textContent = on ? 'ON' : 'OFF'; }
  vol.value = S.vol; vol.disabled = !S.sound;
}
function openSettings(open) { setSheet.hidden = !open; paused = open; down = false; ptrs.clear(); if (open) { syncSettings(); qSeg.querySelector('[aria-checked="true"]').focus(); } else setBtn.focus(); }
setBtn.addEventListener('click', () => { initAudio(); openSettings(true); });
$('setClose').addEventListener('click', () => openSettings(false));
setSheet.addEventListener('pointerdown', e => { if (e.target === setSheet) openSettings(false); });
qSeg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.q === S.q) return;
  S.q = b.dataset.q; Q = QUALITY[S.q]; saveS(); resize(); syncSettings(); });
setSheet.addEventListener('click', e => { const b = e.target.closest('.tog'); if (!b) return; const k = b.dataset.key; S[k] = !S[k]; saveS();
  if (k === 'sound') applyAudio(); if (k === 'shake') { SHAKE_MUL = S.shake ? (reduce ? .25 : 1) : 0; shake = 0; } if (k === 'flash') flashA = 0;
  syncSettings(); });
dSeg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.d === S.dens) return; S.dens = b.dataset.d; saveS(); syncSettings(); });
vol.addEventListener('input', () => { S.vol = +vol.value; applyAudio(); saveS(); });
vol.addEventListener('change', () => sfx('ding', .05, 6));

function resize() {
  DPR = Math.min(Q.dpr, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [cv, bg, dec]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  floorY = H - rackEl.offsetHeight - 22;
  megaFab.style.bottom = (rackEl.offsetHeight + 16) + 'px';
  dcx.setTransform(DPR, 0, 0, DPR, 0, 0);
  glw.width = Math.max(1, Math.round(W * (Q.glow || .1))); glw.height = Math.max(1, Math.round(H * (Q.glow || .1)));
  drawBG();
}
addEventListener('resize', resize);

let last = performance.now(), fps = 60, paused = false;
function frame(now) {
  const rdt = Math.min(.033, (now - last) / 1000); last = now;
  if (rdt > 0) fps += (1 / rdt - fps) * .05;
  if (paused) { render(); requestAnimationFrame(frame); return; }
  let dt = rdt; if (slowT > 0) { slowT -= rdt; dt *= .3; }
  if (!S.hitstop) hitstop = 0;
  if (hitstop > 0) { hitstop -= rdt; dt = 0; }
  update(dt, rdt); render(); hud();
  requestAnimationFrame(frame);
}

function start(d) {
  score = d.score || 0; kills = d.kills || 0; maxCombo = d.maxCombo || 0; gauge = d.gauge || 0; if (kills >= 3) hintA = 0;
  resize();
  const n = maxObjs();
  for (let i = 0; i < n; i++) spawn(i === 2 ? 'barrel' : i === 4 ? 'sign' : pickType(), (i + .5) / n * W + rand(-20, 20), -rand(60, 700));
  setWeapon(d.wi || 0);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
window.claude?.hot?.snapshot?.(() => ({ score, kills, maxCombo, gauge, wi }));
const boot = d => {
  const go = () => start(d || {});
  const fonts = document.fonts ? Promise.race([document.fonts.load(`400 20px ${DF}`), document.fonts.load(`900 20px ${UIF}`), new Promise(r => setTimeout(r, 1500))]).then(() => document.fonts.ready) : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 2000))]).then(go, go);
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
